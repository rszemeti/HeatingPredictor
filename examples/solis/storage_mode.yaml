alias: "Solis: Set Storage Mode Based on Solar vs Battery Space"
description: >
  Every 30 minutes, compare remaining battery capacity against remaining solar
  forecast and choose Feed-in priority (export first) or Self-Use. Grid charging
  stays allowed in both: the battery plan only enables a timed charge slot for
  the window it was planned for, and the discharge slot is switched off once its
  target is reached, so nothing else imports to the battery.
triggers:
  - minutes: /30
    trigger: time_pattern
conditions:
  - condition: template
    value_template: >
      {{ states('sensor.solis8_battery_soc') not in ['unavailable', 'unknown', 'none']
         and states('sensor.solcast_pv_forecast_forecast_remaining_today') not in ['unavailable', 'unknown', 'none'] }}
actions:
  - variables:
      battery_soc: "{{ states('sensor.solis8_battery_soc') | float(0) }}"
      solar_remaining: "{{ states('sensor.solcast_pv_forecast_forecast_remaining_today') | float(0) }}"
      battery_space_kwh: "{{ ((100 - battery_soc) / 100) * 32 }}"
      new_mode: "{{ 'Feed-in priority' if solar_remaining > battery_space_kwh else 'Self-Use' }}"
  - if:
      - condition: template
        value_template: "{{ states('select.solis8_energy_storage_control_switch') != new_mode }}"
    then:
      - action: select.select_option
        target:
          entity_id: select.solis8_energy_storage_control_switch
        data:
          option: "{{ new_mode }}"
mode: single
