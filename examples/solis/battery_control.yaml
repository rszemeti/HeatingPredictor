alias: "Solis: Battery Control"
description: >
  One automation for the Solis battery, driven by the Heat Load Predictor's
  battery plan. Three jobs, chosen by trigger:
  1. Apply plan - at the plan's "next inverter update" time (shortly before each
     window, wherever the tariff puts it) copy each window due in the next 20
     minutes into its Solis slot: times, target SOC and on/off. With
     use_single_slot (the default) every cheap window uses charge slot 1. Every 5 minutes,
     if the plan for a charge window that's already running has changed, write
     it again. If the plan is
     unavailable, fixed Cosy-time triggers keep discharge off and charge to 80%.
  2. Stop discharge at target - every 2 minutes during the discharge window,
     once SOC reaches the target, switch discharge slot 1 off so the inverter
     doesn't import from the grid to hold that level.
  3. Storage mode - every 30 minutes set the mode the plan recommends:
     Self-Use (store all spare solar) unless that would leave too little room
     for the solar above the export limit still to come, Feed-in priority
     (export first, store only the excess) then.
  Adjust the entity names in the variables to suit your installation.
triggers:
  - trigger: time
    at: sensor.heat_pump_battery_next_inverter_update
    id: apply
  # Safety net, used only when the plan is unavailable (Cosy times).
  - trigger: time
    at: "00:25:00"
    id: fallback_discharge_1
  - trigger: time
    at: "03:50:00"
    id: fallback_charge_1
  - trigger: time
    at: "12:50:00"
    id: fallback_charge_2
  - trigger: time
    at: "21:50:00"
    id: fallback_charge_3
  - trigger: time_pattern
    minutes: /5
    id: recheck
  - trigger: time_pattern
    minutes: /2
    id: discharge_check
  - trigger: time_pattern
    minutes: /30
    id: storage_mode
conditions: []
variables:
  plan_entity: sensor.heat_pump_battery_plan
  soc_entity: sensor.solis8_battery_soc
  solar_remaining_entity: sensor.solcast_pv_forecast_forecast_remaining_today
  mode_entity: select.solis8_energy_storage_control_switch
  mask_entity: number.solis8_timed_charge_discharge_on_off
  battery_kwh: 32
  # The inverter's clock: true if it follows UK time (BST in summer), false if
  # it stays on GMT/UTC all year. Window times are written in the inverter's time.
  inverter_uses_local_time: true
  # Use only charge slot 1 for every cheap window (rewritten ~10 minutes before
  # each one) and keep charge slots 2-6 switched off. Safer where an integration
  # maps the other slots unreliably. Set false to give each window its own slot.
  use_single_slot: true
  # With use_single_slot, also clear the on/off bits of charge slots 2-6 in the
  # bitmask register on every write, so whatever times those slots hold, they
  # can't charge. Only the bitmask is written; slots 2-6 themselves are never
  # read or written. Set false to leave their bits as they are.
  clear_unused_slots: true
  plan_ok: "{{ states(plan_entity) not in ['unavailable', 'unknown'] and state_attr(plan_entity, 'slots') is mapping }}"
actions:
  - choose:
      # ---------------------------------------------------------------- 1
      - alias: Apply plan
        conditions:
          - condition: trigger
            id: [apply, recheck]
          - condition: template
            value_template: "{{ plan_ok }}"
        sequence:
          - variables:
              # At the update time: windows starting within the next 20 minutes.
              # Every 5 minutes: a charge window already running whose plan has
              # changed since it was written (e.g. the house used more than
              # forecast), so the decision is never stuck for the whole window.
              due: >-
                {% set ns = namespace(keys=[], first=none, first_t=none) %}
                {% set mask = states(mask_entity) | int(0) %}
                {% for key, w in (state_attr(plan_entity, 'slots') or {}).items() %}
                  {% set mins = (as_timestamp(w.start) - as_timestamp(now())) / 60 %}
                  {% set charge = key.startswith('charge') %}
                  {% set slot = 1 if (use_single_slot and charge) else key.split('_')[1] | int %}
                  {% set sfx = '' if slot == 1 else '_' ~ slot %}
                  {% set on = mask | bitwise_and(2 ** (slot - 1)) > 0 %}
                  {% set soc_set = states('number.solis8_timed_charge_soc' ~ sfx) | int(-1) %}
                  {% set start_set = states('number.solis8_timed_charge_start_hours' ~ sfx) | int(-1) %}
                  {% set start_h = as_timestamp(w.start) | timestamp_custom('%H', inverter_uses_local_time) | int %}
                  {% set running = charge and mins <= 0 and as_timestamp(w.end) > as_timestamp(now()) %}
                  {% set changed = on != w.enabled or start_set != start_h
                     or (w.enabled and soc_set != w.target_soc | int) %}
                  {% if (trigger.id == 'apply' and -1 <= mins <= 20) or (running and changed) %}
                    {% if use_single_slot and charge %}
                      {# One slot: only the earliest charge window goes in. #}
                      {% if ns.first is none or as_timestamp(w.start) < ns.first_t %}
                        {% set ns.first = key %}{% set ns.first_t = as_timestamp(w.start) %}
                      {% endif %}
                    {% else %}
                      {% set ns.keys = ns.keys + [key] %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
                {{ ns.keys + ([ns.first] if ns.first else []) }}
          - repeat:
              for_each: "{{ due }}"
              sequence:
                - variables:
                    key: "{{ repeat.item }}"
                    kind: "{{ key.split('_')[0] }}"
                    slot: "{{ 1 if (use_single_slot and kind == 'charge') else key.split('_')[1] | int }}"
                    w: "{{ state_attr(plan_entity, 'slots')[key] }}"
                    # Solis entity names: slot 1 has no suffix, others end _2, _3 ...
                    prefix: "number.solis8_timed_{{ kind }}"
                    sfx: "{{ '' if slot == 1 else '_' ~ slot }}"
                    # Bitmask: charge slots are bits 0-5, discharge slots bits 6-11.
                    bit: "{{ 2 ** ((slot - 1) + (6 if kind == 'discharge' else 0)) }}"
                    # Times in the inverter's clock (local or UTC).
                    start_h: "{{ as_timestamp(w.start) | timestamp_custom('%H', inverter_uses_local_time) | int }}"
                    start_m: "{{ as_timestamp(w.start) | timestamp_custom('%M', inverter_uses_local_time) | int }}"
                    # A window ending at midnight is written as 23:59.
                    end_hm: >-
                      {% set e = as_timestamp(w.end) | timestamp_custom('%H:%M', inverter_uses_local_time) %}
                      {{ '23:59' if e == '00:00' else e }}
                    mask: "{{ states(mask_entity) | int(0) }}"
                    # Charge slots 2-6 (bits 1-5) are cleared only with clear_unused_slots.
                    new_mask: >-
                      {% set m = (mask | bitwise_or(bit)) if w.enabled else (mask | bitwise_and(4095 - bit)) %}
                      {{ m | bitwise_and(4095 - 62) if (use_single_slot and clear_unused_slots) else m }}
                - action: number.set_value
                  target: { entity_id: "{{ prefix }}_start_hours{{ sfx }}" }
                  data: { value: "{{ start_h }}" }
                - action: number.set_value
                  target: { entity_id: "{{ prefix }}_start_minutes{{ sfx }}" }
                  data: { value: "{{ start_m }}" }
                - action: number.set_value
                  target: { entity_id: "{{ prefix }}_end_hours{{ sfx }}" }
                  data: { value: "{{ end_hm.split(':')[0] | int }}" }
                - action: number.set_value
                  target: { entity_id: "{{ prefix }}_end_minutes{{ sfx }}" }
                  data: { value: "{{ end_hm.split(':')[1] | int }}" }
                - if:
                    - condition: template
                      value_template: "{{ w.enabled }}"
                  then:
                    - action: number.set_value
                      target: { entity_id: "{{ prefix }}_soc{{ sfx }}" }
                      data: { value: "{{ w.target_soc }}" }
                - action: number.set_value
                  target: { entity_id: "{{ mask_entity }}" }
                  data: { value: "{{ new_mask }}" }
                - action: system_log.write
                  data:
                    level: info
                    message: >-
                      Battery plan {{ key }} -> {{ kind }} slot {{ slot }} ({{ trigger.id }}): {{ 'ON' if w.enabled else 'off' }}
                      {{ '%02d:%02d' % (start_h, start_m) }}-{{ end_hm }}
                      {% if w.enabled %}to {{ w.target_soc }}%{% endif %} - {{ w.reason }}.
                      Bitmask {{ mask }} -> {{ new_mask }}.
          - if:
              - condition: template
                value_template: "{{ due | count > 0 }}"
            then:
              - action: script.solis8_update_charge_discharge_times

      # ---------------------------------------------------------------- 1b
      - alias: Safety net when the plan is unavailable
        conditions:
          - condition: trigger
            id: [fallback_discharge_1, fallback_charge_1, fallback_charge_2, fallback_charge_3]
          - condition: template
            value_template: "{{ not plan_ok }}"
        sequence:
          - variables:
              kind: "{{ trigger.id.split('_')[1] }}"
              window: "{{ trigger.id.split('_')[2] | int }}"
              charge: "{{ kind == 'charge' }}"
              slot: "{{ 1 if (use_single_slot and charge) else window }}"
              sfx: "{{ '' if slot == 1 else '_' ~ slot }}"
              bit: "{{ 2 ** ((slot - 1) + (6 if kind == 'discharge' else 0)) }}"
              mask: "{{ states(mask_entity) | int(0) }}"
              new_mask: >-
                {% set m = (mask | bitwise_or(bit)) if charge else (mask | bitwise_and(4095 - bit)) %}
                {{ m | bitwise_and(4095 - 62) if (use_single_slot and clear_unused_slots) else m }}
              # Cosy times for each fallback window (start h, end h, end m).
              times: "{{ {1: [4, 7, 0], 2: [13, 16, 0], 3: [22, 23, 59]}[window] }}"
          - if:
              - condition: template
                value_template: "{{ charge }}"
            then:
              - if:
                  - condition: template
                    value_template: "{{ use_single_slot }}"
                then:
                  # One slot serves every window: put this window's times in it.
                  - action: number.set_value
                    target: { entity_id: "number.solis8_timed_charge_start_hours" }
                    data: { value: "{{ times[0] }}" }
                  - action: number.set_value
                    target: { entity_id: "number.solis8_timed_charge_start_minutes" }
                    data: { value: 0 }
                  - action: number.set_value
                    target: { entity_id: "number.solis8_timed_charge_end_hours" }
                    data: { value: "{{ times[1] }}" }
                  - action: number.set_value
                    target: { entity_id: "number.solis8_timed_charge_end_minutes" }
                    data: { value: "{{ times[2] }}" }
              - action: number.set_value
                target: { entity_id: "number.solis8_timed_charge_soc{{ sfx }}" }
                data: { value: 80 }
          - action: number.set_value
            target: { entity_id: "{{ mask_entity }}" }
            data: { value: "{{ new_mask }}" }
          - action: script.solis8_update_charge_discharge_times
          - action: system_log.write
            data:
              level: warning
              message: >-
                Battery plan unavailable at {{ trigger.id }}:
                {{ 'charging to 80%' if charge else 'discharge off' }}. Bitmask {{ mask }} -> {{ new_mask }}.

      # ---------------------------------------------------------------- 2
      - alias: Stop discharge at target
        conditions:
          - condition: trigger
            id: discharge_check
          - condition: template
            value_template: >-
              {% set w = (state_attr(plan_entity, 'slots') or {}).get('discharge_1') %}
              {{ w is mapping and w.enabled and as_datetime(w.start) <= now() < as_datetime(w.end) }}
          - condition: template
            value_template: "{{ states(mask_entity) | int(0) | bitwise_and(64) > 0 }}"
          - condition: template
            value_template: >-
              {{ states(soc_entity) | float(100) <=
                 states('number.solis8_timed_discharge_soc') | float(0) + 1 }}
        sequence:
          - variables:
              mask: "{{ states(mask_entity) | int(0) }}"
              new_mask: "{{ mask | bitwise_and(4095 - 64) }}"
          - action: number.set_value
            target: { entity_id: "{{ mask_entity }}" }
            data: { value: "{{ new_mask }}" }
          - action: script.solis8_update_charge_discharge_times
          - action: system_log.write
            data:
              level: info
              message: >-
                Discharge slot 1 off - SOC {{ states(soc_entity) }}% reached target
                {{ states('number.solis8_timed_discharge_soc') }}%. Bitmask {{ mask }} -> {{ new_mask }}.

      # ---------------------------------------------------------------- 3
      - alias: Storage mode
        conditions:
          - condition: trigger
            id: storage_mode
        sequence:
          - variables:
              # The plan stores as much as it can, as early as it can, without
              # clipping: Self-Use until the room left is what the solar above
              # the export limit still needs, Feed-in priority while it is.
              # If the plan is unavailable, fall back to a simple comparison.
              planned: "{{ state_attr(plan_entity, 'storage_mode') }}"
              space_kwh: "{{ (100 - states(soc_entity) | float(50)) / 100 * battery_kwh }}"
              new_mode: >-
                {% if planned in ['Self-Use', 'Feed-in priority'] %}{{ planned }}
                {% elif states(solar_remaining_entity) | is_number
                       and states(solar_remaining_entity) | float > space_kwh %}Feed-in priority
                {% else %}Self-Use{% endif %}
          - if:
              - condition: template
                value_template: "{{ states(mode_entity) != new_mode }}"
            then:
              - action: select.select_option
                target: { entity_id: "{{ mode_entity }}" }
                data: { option: "{{ new_mode }}" }
mode: queued
max: 10
trace:
  stored_traces: 30
