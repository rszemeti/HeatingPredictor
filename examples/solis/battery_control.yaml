alias: "Solis: Battery Control"
description: >
  One automation for the Solis battery, driven by the Heat Load Predictor's
  battery plan. Three jobs, chosen by trigger:
  1. Apply plan - shortly before each window (discharge slot 1 at 00:25, charge
     slots 1-3 at 03:50, 12:50, 21:50 for Cosy Octopus) copy the plan's times,
     target SOC and on/off into the inverter. If the plan is unavailable,
     discharge stays off and charging falls back to 80%.
  2. Stop discharge at target - every 2 minutes during the discharge window,
     once SOC reaches the target, switch discharge slot 1 off so the inverter
     doesn't import from the grid to hold that level.
  3. Storage mode - every 30 minutes choose Feed-in priority (export first)
     when today's remaining solar won't fit in the battery, otherwise Self-Use.
  Adjust the entity names in the variables to suit your installation.
triggers:
  - trigger: time
    at: "00:25:00"
    id: discharge_1
  - trigger: time
    at: "03:50:00"
    id: charge_1
  - trigger: time
    at: "12:50:00"
    id: charge_2
  - trigger: time
    at: "21:50:00"
    id: charge_3
  - trigger: time_pattern
    minutes: /2
    id: discharge_check
  - trigger: time_pattern
    minutes: /30
    id: storage_mode
conditions: []
variables:
  plan_entity: sensor.heat_pump_battery_plan
  soc_entity: sensor.solis8_battery_soc
  solar_remaining_entity: sensor.solcast_pv_forecast_forecast_remaining_today
  mode_entity: select.solis8_energy_storage_control_switch
  mask_entity: number.solis8_timed_charge_discharge_on_off
  battery_kwh: 32
actions:
  - choose:
      # ---------------------------------------------------------------- 1
      - alias: Apply plan
        conditions:
          - condition: trigger
            id: [discharge_1, charge_1, charge_2, charge_3]
        sequence:
          - variables:
              kind: "{{ trigger.id.split('_')[0] }}"
              slot: "{{ trigger.id.split('_')[1] | int }}"
              plan: "{{ (state_attr(plan_entity, 'slots') or {}).get(trigger.id) }}"
              ok: "{{ plan is mapping and states(plan_entity) not in ['unavailable', 'unknown'] }}"
              # Solis entity names: slot 1 has no suffix, others end _2, _3 ...
              prefix: "number.solis8_timed_{{ kind }}"
              sfx: "{{ '' if slot == 1 else '_' ~ slot }}"
              # Bitmask: charge slots are bits 0-5, discharge slots bits 6-11.
              bit: "{{ 2 ** ((slot - 1) + (6 if kind == 'discharge' else 0)) }}"
              start_h: "{{ as_datetime(plan.start).hour if ok else 0 }}"
              start_m: "{{ as_datetime(plan.start).minute if ok else 0 }}"
              # A window ending at midnight is written as 23:59.
              end_hm: >-
                {% set e = as_datetime(plan.end) if ok else none %}
                {{ '23:59' if not e or (e.hour == 0 and e.minute == 0) else e.strftime('%H:%M') }}
              enabled: "{{ plan.enabled if ok else kind == 'charge' }}"
              target: "{{ plan.target_soc if ok else 80 }}"
              mask: "{{ states(mask_entity) | int(0) }}"
              new_mask: "{{ (mask | bitwise_or(bit)) if enabled else (mask | bitwise_and(4095 - bit)) }}"
          - if:
              - condition: template
                value_template: "{{ ok }}"
            then:
              - action: number.set_value
                target: { entity_id: "{{ prefix }}_start_hours{{ sfx }}" }
                data: { value: "{{ start_h }}" }
              - action: number.set_value
                target: { entity_id: "{{ prefix }}_start_minutes{{ sfx }}" }
                data: { value: "{{ start_m }}" }
              - action: number.set_value
                target: { entity_id: "{{ prefix }}_end_hours{{ sfx }}" }
                data: { value: "{{ end_hm.split(':')[0] | int }}" }
              - action: number.set_value
                target: { entity_id: "{{ prefix }}_end_minutes{{ sfx }}" }
                data: { value: "{{ end_hm.split(':')[1] | int }}" }
          - if:
              - condition: template
                value_template: "{{ enabled }}"
            then:
              - action: number.set_value
                target: { entity_id: "{{ prefix }}_soc{{ sfx }}" }
                data: { value: "{{ target }}" }
          - action: number.set_value
            target: { entity_id: "{{ mask_entity }}" }
            data: { value: "{{ new_mask }}" }
          - action: script.solis8_update_charge_discharge_times
          - action: system_log.write
            data:
              level: "{{ 'info' if ok else 'warning' }}"
              message: >-
                Battery plan {{ trigger.id }}:
                {% if ok %}{{ 'ON' if enabled else 'off' }}
                {{ '%02d:%02d' % (start_h, start_m) }}-{{ end_hm }}
                {% if enabled %}to {{ target }}%{% endif %} - {{ plan.reason }}.
                {% else %}plan unavailable, {{ 'charging to 80%' if kind == 'charge' else 'discharge off' }}.
                {% endif %}
                Bitmask {{ mask }} -> {{ new_mask }}.

      # ---------------------------------------------------------------- 2
      - alias: Stop discharge at target
        conditions:
          - condition: trigger
            id: discharge_check
          - condition: template
            value_template: >-
              {% set w = (state_attr(plan_entity, 'slots') or {}).get('discharge_1') %}
              {{ w is mapping and as_datetime(w.start) <= now() < as_datetime(w.end) }}
          - condition: template
            value_template: "{{ states(mask_entity) | int(0) | bitwise_and(64) > 0 }}"
          - condition: template
            value_template: >-
              {{ states(soc_entity) | float(100) <=
                 states('number.solis8_timed_discharge_soc') | float(0) + 1 }}
        sequence:
          - variables:
              mask: "{{ states(mask_entity) | int(0) }}"
              new_mask: "{{ mask | bitwise_and(4095 - 64) }}"
          - action: number.set_value
            target: { entity_id: "{{ mask_entity }}" }
            data: { value: "{{ new_mask }}" }
          - action: script.solis8_update_charge_discharge_times
          - action: system_log.write
            data:
              level: info
              message: >-
                Discharge slot 1 off - SOC {{ states(soc_entity) }}% reached target
                {{ states('number.solis8_timed_discharge_soc') }}%. Bitmask {{ mask }} -> {{ new_mask }}.

      # ---------------------------------------------------------------- 3
      - alias: Storage mode
        conditions:
          - condition: trigger
            id: storage_mode
          - condition: template
            value_template: >-
              {{ states(soc_entity) | is_number and states(solar_remaining_entity) | is_number }}
        sequence:
          - variables:
              space_kwh: "{{ (100 - states(soc_entity) | float) / 100 * battery_kwh }}"
              new_mode: >-
                {{ 'Feed-in priority' if states(solar_remaining_entity) | float > space_kwh else 'Self-Use' }}
          - if:
              - condition: template
                value_template: "{{ states(mode_entity) != new_mode }}"
            then:
              - action: select.select_option
                target: { entity_id: "{{ mode_entity }}" }
                data: { option: "{{ new_mode }}" }
mode: queued
max: 10
