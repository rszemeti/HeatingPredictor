name: Release

on:
  release:
    # "edited" too, so retagging a release rebuilds its zip rather than
    # leaving the old one attached.
    types: [published, edited]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set version in manifest
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          python3 - "$VERSION" <<'PY'
          import json, sys
          p = "custom_components/heat_load_predictor/manifest.json"
          m = json.load(open(p)); m["version"] = sys.argv[1]
          json.dump(m, open(p, "w"), indent=2); open(p, "a").write("\n")
          PY
      - name: Zip integration
        run: cd custom_components/heat_load_predictor && zip -r ../../heat_load_predictor.zip .
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: heat_load_predictor.zip
          overwrite_files: true
