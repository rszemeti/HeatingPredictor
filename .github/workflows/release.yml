name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set version in manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 - "$VERSION" <<'PY'
          import json, sys
          p = "custom_components/heat_load_predictor/manifest.json"
          m = json.load(open(p)); m["version"] = sys.argv[1]
          json.dump(m, open(p, "w"), indent=2); open(p, "a").write("\n")
          PY
      - name: Zip integration
        run: cd custom_components/heat_load_predictor && zip -r ../../heat_load_predictor.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: heat_load_predictor.zip
